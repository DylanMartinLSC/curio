<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curio</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1d1d1b;--muted:#6b6a65;--line:#e3e1db;--accent:#8a5a14;--accent-ink:#fff;--ok:#2f7d4a;--warn:#a76a00;--bad:#b23b3b;--chip:#f0ede6}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--panel:#1d1d1b;--ink:#ecebe6;--muted:#9c9a93;--line:#33322e;--accent:#d9a548;--accent-ink:#1d1d1b;--ok:#6cc08b;--warn:#e0a843;--bad:#e07a7a;--chip:#2a2926}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:18px;margin:0;letter-spacing:.02em}
header .sub{color:var(--muted);font-size:13px}
nav{margin-left:auto;display:flex;gap:4px}
nav button{background:none;border:1px solid transparent;color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{border-color:var(--line);background:var(--chip)}
main{max-width:1180px;margin:0 auto;padding:20px 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
#drop{border:2px dashed var(--line);border-radius:10px;padding:28px;text-align:center;cursor:pointer;color:var(--muted)}
#drop.over{border-color:var(--accent);color:var(--ink)}
select,input[type=text]{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
button.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer}
button.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
.grid{display:grid;grid-template-columns:300px 1fr;gap:16px;margin-top:16px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.cand{display:flex;gap:10px;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.cand:hover{background:var(--chip)}.cand.on{border-color:var(--accent);background:var(--chip)}
.cand img{width:56px;height:56px;object-fit:contain;border-radius:6px;background:var(--chip)}
.cand .t{font-weight:600;font-size:14px}.cand .m{font-size:12px;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:4px}.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.verdict{padding:10px 14px;border-radius:8px;margin-top:16px;border:1px solid var(--line)}
.verdict.match{border-color:var(--ok)}.verdict.ambiguous{border-color:var(--warn)}.verdict.no_match{border-color:var(--bad)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare figure{margin:0}.compare img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--chip);border-radius:8px}
.compare figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.thumbs img{width:48px;height:48px;object-fit:contain;border-radius:4px;background:var(--chip);cursor:pointer}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--chip);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
h2{font-size:16px;margin:18px 0 8px}h3{font-size:14px;margin:14px 0 6px;color:var(--muted);font-weight:600}
ul.explain{margin:0;padding-left:18px}ul.explain li{margin:3px 0}
.attrs{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;font-size:14px}.attrs dt{color:var(--muted)}.attrs dd{margin:0}
.muted{color:var(--muted)}.hidden{display:none}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>Curio</h1><span class="sub" id="status">loading…</span>
  <nav><button data-tab="identify" class="on">Identify</button><button data-tab="collection">My collection</button><button data-tab="packs">Packs</button></nav>
</header>
<main>
<div id="notes" class="verdict ambiguous hidden" style="margin:0 0 16px"></div>
<section id="tab-identify">
  <div class="panel">
    <div id="drop">Drop a photo here, or click to choose / take one<br><span class="muted" style="font-size:13px">Photos are processed on this computer only.</span></div>
    <input id="file" type="file" accept="image/*" capture="environment" class="hidden">
    <div class="row" style="margin-top:12px">
      <label>Type <select id="domain"><option value="">Any</option></select></label>
      <span id="textsearch" class="row hidden"><input type="text" id="q" placeholder="or describe it: 1909 wheat penny" size="30"><button class="ghost" id="qgo">Search</button></span>
    </div>
  </div>
  <div id="verdict" class="verdict hidden"></div>
  <div id="results" class="grid hidden">
    <div class="panel"><h3 style="margin-top:0">Candidates</h3><div id="cands"></div></div>
    <div class="panel" id="detail"></div>
  </div>
</section>
<section id="tab-collection" class="hidden"><div class="panel" id="coll"></div></section>
<section id="tab-packs" class="hidden"><div class="panel" id="packs"></div></section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let state = {res: null, sel: 0, photo: null, info: null};

function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),2500)}
async function api(url, opts){const r=await fetch(url,opts);if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail}catch{}throw new Error(m)}return r.json()}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  ["identify","collection","packs"].forEach(t => $("#tab-"+t).classList.toggle("hidden", t !== b.dataset.tab));
  if (b.dataset.tab === "collection") loadCollection();
});

async function init(){
  const info = state.info = await api("/api/packs");
  const domains = [...new Set(info.packs.map(p => p.domain))];
  domains.forEach(d => $("#domain").insertAdjacentHTML("beforeend", `<option>${esc(d)}</option>`));
  $("#status").textContent = `${info.packs.reduce((a,p)=>a+p.items,0)} items in ${info.packs.length} pack(s) · ${info.embedder}`;
  if (info.supports_text) $("#textsearch").classList.remove("hidden");
  const warns = (info.notes || []).filter(n => n.level === "warning");
  $("#notes").classList.toggle("hidden", !warns.length);
  $("#notes").innerHTML = warns.map(n => esc(n.message)).join("<br>");
  $("#packs").innerHTML = `<h2 style="margin-top:0">Installed packs</h2><div class="scroll"><table><tr><th>Pack</th><th>Type</th><th class="num">Items</th><th class="num">Images</th><th>Version</th><th>License</th><th>Recommended embedder</th></tr>${
    info.packs.map(p=>`<tr><td><b>${esc(p.name)}</b><br><span class="muted">${esc(p.id)} ${esc(p.description)}</span></td><td>${esc(p.domain)}</td><td class="num">${p.items}</td><td class="num">${p.images}</td><td>${esc(p.version)}</td><td>${esc(p.license)}</td><td>${p.recommended_embedder ? esc(p.recommended_embedder.name + (p.recommended_embedder.model ? " (" + p.recommended_embedder.model + ")" : "")) : "—"}</td></tr>`).join("")}</table></div>
    <p class="muted">Packs are plain folders of photos and JSON maintained by the community. Add more with <code>curio install &lt;dir&gt;</code>.</p>`;
}

const drop = $("#drop");
drop.onclick = () => $("#file").click();
drop.ondragover = e => {e.preventDefault(); drop.classList.add("over")};
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => {e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) identify(e.dataTransfer.files[0])};
$("#file").onchange = e => e.target.files[0] && identify(e.target.files[0]);
$("#qgo").onclick = textSearch; $("#q").onkeydown = e => e.key === "Enter" && textSearch();

async function identify(file){
  state.photo = URL.createObjectURL(file);
  $("#status").textContent = "identifying…";
  const fd = new FormData(); fd.append("file", file); fd.append("domain", $("#domain").value);
  try { show(await api("/api/identify", {method:"POST", body: fd})); }
  catch(e){ toast(e.message); }
  init();
}
async function textSearch(){
  const q = $("#q").value.trim(); if (!q) return;
  state.photo = null;
  try { show(await api(`/api/search?q=${encodeURIComponent(q)}&domain=${encodeURIComponent($("#domain").value)}`)); }
  catch(e){ toast(e.message); }
}

function show(res){
  state.res = res; state.sel = 0;
  const v = $("#verdict"); v.className = "verdict " + res.verdict;
  const head = {match:"Likely match", ambiguous:"Close call — please compare", no_match:"No confident match", ranked:"Search results"}[res.verdict];
  v.innerHTML = `<b>${head}</b><ul class="explain">${res.explanation.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`;
  $("#results").classList.toggle("hidden", !res.candidates.length);
  renderCands(); renderDetail();
}
function renderCands(){
  $("#cands").innerHTML = state.res.candidates.map((c,i)=>`<div class="cand ${i===state.sel?"on":""}" data-i="${i}">
    <img src="${c.matched_image_url}" alt=""><div style="flex:1;min-width:0"><div class="t">${esc(c.title)}</div>
    <div class="m">${esc(c.pack_name)} · sim ${c.similarity.toFixed(3)}</div><div class="bar"><i style="width:${Math.round(c.confidence*100)}%"></i></div>
    <div class="m">${Math.round(c.confidence*100)}% of candidate confidence</div></div></div>`).join("");
  document.querySelectorAll(".cand").forEach(el => el.onclick = () => {state.sel = +el.dataset.i; renderCands(); renderDetail();});
}
function renderDetail(){
  const c = state.res.candidates[state.sel]; if (!c) return;
  const attrs = Object.entries(c.attributes);
  $("#detail").innerHTML = `
    <div class="compare">
      ${state.photo ? `<figure><img src="${state.photo}" alt="your photo"><figcaption>Your photo</figcaption></figure>` : ""}
      <figure><img id="refimg" src="${c.matched_image_url}" alt="reference"><figcaption>Closest reference ${c.matched_learned ? "(a photo you confirmed earlier)" : "photo"}</figcaption></figure>
    </div>
    <div class="thumbs">${c.images.map(im=>`<img src="${im.url}" title="${esc([im.side, im.source, im.license].filter(Boolean).join(" · "))}">`).join("")}</div>
    <h2>${esc(c.title)}</h2>
    ${attrs.length ? `<dl class="attrs">${attrs.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}
    ${c.notes ? `<p class="muted">${esc(c.notes)}</p>` : ""}
    <div class="row" style="margin-top:12px">
      ${state.res.upload_id ? `<button class="primary" id="confirm">Yes, this is it</button>` : ""}
      <button class="ghost" id="collect">Add to collection</button>
    </div>`;
  document.querySelectorAll(".thumbs img").forEach(t => t.onclick = () => $("#refimg").src = t.src);
  if ($("#confirm")) $("#confirm").onclick = async () => {
    await api("/api/confirm", {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({upload_id: state.res.upload_id, item_key: c.key})});
    toast("Thanks — saved as a local reference so similar photos match better.");
  };
  $("#collect").onclick = async () => {
    await api("/api/collection", {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({item_key: c.key, upload_id: state.res.upload_id || null})});
    toast("Added to your collection.");
  };
}

async function loadCollection(){
  const d = await api("/api/collection");
  $("#coll").innerHTML = `<h2 style="margin-top:0">My collection</h2>
    ${d.items.length ? `<div class="scroll"><table><tr><th></th><th>Item</th><th>Added</th><th></th></tr>
    ${d.items.map(r=>`<tr><td>${r.photo_url?`<img src="${r.photo_url}" style="width:48px;height:48px;object-fit:contain;border-radius:4px">`:""}</td>
      <td>${esc(r.title)}<br><span class="muted">${esc(r.item_key)}</span></td>
      <td>${esc(r.added.slice(0,10))}</td><td><button class="ghost" data-del="${r.id}">Remove</button></td></tr>`).join("")}</table></div>`
    : `<p class="muted">Nothing here yet. Identify something and press “Add to collection”.</p>`}`;
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {await fetch("/api/collection/"+b.dataset.del,{method:"DELETE"}); loadCollection();});
}
init().catch(e => $("#status").textContent = "error: " + e.message);
</script>
</body>
</html>
